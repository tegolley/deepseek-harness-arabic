name: Arabic support checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  web-client:
    runs-on: ubuntu-latest
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_SNAPSHOT: replay
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Arabic presentation tests
        run: corepack pnpm exec vitest run packages/client/ui-arabic-support/tests
      - name: Web client tests
        run: corepack pnpm exec vitest run packages/client packages/host --maxWorkers=2 --testTimeout=30000
      - name: Install Chromium for Web replay tests
        run: corepack pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Assemble Web client and run replay tests
        run: corepack pnpm run test:web
